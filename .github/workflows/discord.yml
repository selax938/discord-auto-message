
name: Message automatique Discord

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le message Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          DAYS=$(( $(date -u +%s) / 86400 ))

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ $((DAYS % 3)) -eq 0 ]; then
            curl -f -H "Content-Type: application/json" \
              -X POST \
              -d '{"content":"🔔 Bonjour ! Voici ton message automatique Discord !"}' \
              "$DISCORD_WEBHOOK_URL"
          fi
