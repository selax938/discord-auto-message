
name: Message automatique Discord

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le message Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          DAYS=$(( $(date -u +%s) / 86400 ))

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$EVENT_NAME" = "schedule" ] && [ $((DAYS % 3)) -eq 0 ]; }; then
            curl -fSs -H "Content-Type: application/json" \
              -X POST \
              -d '{"content":"Allez met toi su l'do ! Messieurs soyez motiver, sinon vous allez finir chez Intermarché toute votre vie comme moi. "}' \
              "$DISCORD_WEBHOOK_URL"
          fi
